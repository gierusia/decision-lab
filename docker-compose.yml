services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decision_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decision_lab}
      POSTGRES_DB: ${POSTGRES_DB:-decision_lab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decision_lab}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-decision_lab}:${POSTGRES_PASSWORD:-decision_lab}@postgres:5432/${POSTGRES_DB:-decision_lab}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: "false"
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      network: host
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:8000
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
